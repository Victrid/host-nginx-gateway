apiVersion: v1
kind: Namespace
metadata:
  name: e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: e2e
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          # Built offline for the E2E lane (see e2e/README.md); import into
          # k3s containerd before running run.sh.
          image: localhost/hng-e2e/backend:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: BODY
              value: "hng-e2e-backend"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: e2e
spec:
  selector: { app: backend }
  ports:
    - name: http
      port: 8080
      targetPort: 8080

# Scenario 4: TLS termination + orphan cleanup (DESIGN.md §5.3).
# Requires secret e2e/e2e-tls (created by run.sh from a self-signed cert).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-route
  namespace: e2e
spec:
  parentRefs:
    - name: main
      sectionName: secure
  hostnames: ["tls.example.com"]
  rules:
    - backendRefs:
        - name: backend
          port: 8080

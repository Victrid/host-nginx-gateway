{{/*
host-nginx-gateway DaemonSet (DESIGN.md §8.1):
  hostPID      — liveness probe reads the nginx pid and kill(pid,0)s a
                 host PID;
  hostPath     — /etc/nginx (RW: generated conf, certs, temp main config),
                 /host/run (RO: host /run, for nginx.pid). NOT mounted at
                 /run: a pod's /run belongs to the runtime (the projected
                 ServiceAccount token mounts under /run/secrets/... and
                 runc must create that mountpoint — impossible inside a
                 read-only hostPath mounted at /run);
  nsenter exec — every nginx -t / nginx -s reload runs in the HOST network
                 + mount namespaces via `nsenter -t 1 -n -m` (the only exec
                 path), so validation sees the host's real addresses and
                 reload see exactly what the
                 host nginx will load;
  in-cluster   — ServiceAccount token only, no kubeconfig mount.

connectionSidecar=true adds (DESIGN-cluster-proxy.md):
  * a /run/hng-proxy hostPath (DirectoryOrCreate) mounted RW into BOTH
    containers — the controller writes proxy.json, the sidecar binds the
    *.sock files nginx dials (independent of the RO /host/run mount);
  * Pod-level automountServiceAccountToken: false with a projected token
    volume mounted into the CONTROLLER container only; the sidecar holds
    no Kubernetes credentials at all.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "host-nginx-gateway.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "host-nginx-gateway.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "host-nginx-gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "host-nginx-gateway.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "host-nginx-gateway.serviceAccountName" . }}
      {{- if .Values.connectionSidecar }}
      # The sidecar must never see Kubernetes credentials: only the
      # controller container mounts the projected token volume below.
      automountServiceAccountToken: false
      {{- end }}
      hostPID: true
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --nginx-conf-dir={{ .Values.nginx.confDir }}/conf.d/k8s-gw
            - --nginx-pid={{ .Values.nginx.pidPath }}
            - --nginx-binary={{ .Values.nginx.binary }}
            - --healthz-addr={{ .Values.healthzAddr }}
            {{- if .Values.dangerouslyAllowNginxSnippets }}
            - --dangerously-allow-nginx-snippets
            {{- end }}
            {{- if .Values.dangerouslyAllowExtraFiles }}
            - --dangerously-allow-extra-files
            {{- end }}
            {{- if .Values.connectionSidecar }}
            - --cluster-proxy-sockets=/run/hng-proxy
            {{- end }}
            {{- range .Values.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Downward API: the NODE's primary IP. Inside a pod the
            # interface route sees the pod network, so the controller cannot
            # detect the host address to advertise in Gateway
            # status.addresses (§3.4) without help.
            - name: HNG_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Downward API: the node's name — identifies this node in
            # ListenerSkippedOnNode events (multinode ownership,
            # DESIGN-multinode-addresses.md §0).
            - name: HNG_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- if .Values.probes.enabled }}
          # healthz binds 127.0.0.1 inside the pod — kubelet cannot
          # httpGet it, so use a local exec probe.
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "http://{{ .Values.healthzAddr }}/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: host-nginx-etc
              mountPath: {{ .Values.nginx.confDir }}
            - name: host-run
              # /run is NOT used as the mount target: the runtime owns a
              # pod's /run (projected SA token mountpoint must be creatable).
              mountPath: /host/run
              readOnly: true
            {{- if .Values.connectionSidecar }}
            # Shared cluster-proxy sockets dir (RW: the controller writes
            # proxy.json here; nginx connects to the sidecar's *.sock).
            - name: cluster-proxy-sockets
              mountPath: /run/hng-proxy
            # Projected ServiceAccount token (the pod-level automount is
            # off so the sidecar container gets no credentials). Mounted
            # at the standard path controller-runtime's in-cluster config
            # reads, with the usual ca.crt + namespace companions.
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
        {{- if .Values.connectionSidecar }}
        - name: cluster-proxy-sidecar
          # Same Go build target as the controller, different ENTRYPOINT
          # (DESIGN-cluster-proxy.md §0.10); released with the same tag.
          image: "ghcr.io/victrid/hng-sidecar:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --sockets-dir=/run/hng-proxy
            - --healthz-addr=127.0.0.1:9126
          # Readiness = mapping loaded && socket count == mapping entry
          # count (DESIGN-cluster-proxy.md §0.9). Deliberately NOT a dial
          # check: backend health is not the sidecar's readiness.
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "http://127.0.0.1:9126/healthz"]
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: cluster-proxy-sockets
              mountPath: /run/hng-proxy
        {{- end }}
      volumes:
        - name: host-nginx-etc
          hostPath:
            path: {{ .Values.nginx.confDir }}
            type: DirectoryOrCreate
        - name: host-run
          hostPath:
            path: /run
            type: Directory
        {{- if .Values.connectionSidecar }}
        # Cluster-proxy socket dir: host /run/hng-proxy (tmpfs — cleared
        # on reboot; both sides self-heal from an empty dir).
        - name: cluster-proxy-sockets
          hostPath:
            path: /run/hng-proxy
            type: DirectoryOrCreate
        # Projected ServiceAccount credentials for the CONTROLLER only.
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
